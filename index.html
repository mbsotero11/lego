<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="assets/css/base.css">
    <link rel="stylesheet" href="assets/css/main.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">
</head>

<body>

    <div class="mobile-page">

        <!-- Menu lateral -->
        <aside class="sidebar">
            <div class="logo"><img src="assets/images/lego.png" alt="LEGO"></div>

            <nav class="menu">
                <div class="menu-icon"><img src="assets/images/cart.png" alt="Carrinho de compras"></div>
                <div class="menu-icon"><img src="assets/images/airplay.png" alt="Buscar"></div>
                <div class="menu-icon"><img src="assets/images/mais.png" alt="Favoritos"></div>
                <div class="menu-icon"><img src="assets/images/carinha.png" alt="Usuário"></div>
                <div class="menu-icon"><img src="assets/images/computador.png" alt="Menu"></div>
            </nav>

            <div class="settings"><img src="assets/images/settings.png" alt="Configurações"></div>
        </aside>

        <!-- Conteúdo principal -->
        <main class="content">

            <!-- Apresentação -->
            <section class="hero">

                <div class="hero-text">
                    <p class="eyebrow">BUILD YOUR PERFECT WORLD</p>

                    <h1>
                        Enter my World<br>
                        of LEGOs
                    </h1>
                </div>

                <img src="assets/images/spider-man.png" alt="Homem-Aranha" class="spiderman" />

                <div class="hero-decoration"></div>

            </section>

            <!-- Notícias e conteúdos -->
            <section class="discover">

                <div class="features">

                    <article class="feature">
                        <span class="feature-icon">⬡</span>
                        <p>How to build<br>your world?</p>
                    </article>

                    <article class="feature">
                        <span class="feature-icon">⬡</span>
                        <p>Want to dominate<br>the world with spider<br>lego?</p>
                    </article>

                    <article class="feature">
                        <span class="feature-icon">⬡</span>
                        <p>Lego World Out<br>now!</p>
                    </article>

                </div>

                <h2 class="section-title">LEGO NEWS</h2>

                <div class="news-grid">

                    <article class="news-card">
                        <img src="assets/images/colorido.avif" alt="Coleção de peças LEGO">
                    </article>

                    <article class="news-card">
                        <img src="assets/images/lula.png" alt="Novidades do universo LEGO">
                    </article>

                </div>

            </section>

        </main>

    </div>

</body>

</html>
